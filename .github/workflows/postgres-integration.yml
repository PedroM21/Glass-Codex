name: PostgreSQL integration tests

on:
  push:
    branches:
      - refactor/v2-auth-jwt-step-1

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: glass_codex_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: glass_codex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glass_codex_test -d glass_codex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://glass_codex_test:test-only-password@127.0.0.1:5432/glass_codex_test
      TEST_DATABASE_URL: postgres://glass_codex_test:test-only-password@127.0.0.1:5432/glass_codex_test

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply the repository's existing Drizzle migrations to test PostgreSQL
        run: npx drizzle-kit migrate
      - name: Run real PostgreSQL integration tests
        run: npm run test:db
