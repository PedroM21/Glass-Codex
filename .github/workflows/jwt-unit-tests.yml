name: Authentication unit tests

on:
  push:
    branches:
      - refactor/v2-auth-jwt-step-1

permissions:
  contents: read

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run authentication unit tests
        run: npm test
      - name: Generate Next.js types and type-check
        run: npx next typegen && npx tsc --noEmit
